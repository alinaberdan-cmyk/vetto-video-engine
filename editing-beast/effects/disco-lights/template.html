<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Meme Chaos (Teammate A's move in the dumb-scale edit, 17 Nov 2026): a disco ball drops in on a string, spins and
   sparkles; six colour beams sweep down from it, seven soft colour spots wander over the room, the room is dimmed
   and the light flickers. Alina paired it with a ~130 BPM dance beat ("Disco beat (Alina)" in the Sound step). */
#v { position: absolute; inset: 0; }
#beams, #spots { position: absolute; inset: 0; mix-blend-mode: screen; }
.beam { position: absolute; width: 260px; height: 2300px; margin-left: -130px; transform-origin: 50% 0;
        clip-path: polygon(50% 0, 0 100%, 100% 100%); filter: blur(10px); }
.spot { position: absolute; border-radius: 50%; filter: blur(26px); }
#ball { position: absolute; left: 0; top: 0; }
#string { position: absolute; width: 4px; background: #cfcfcf; top: 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div id="v"><video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
  <div id="beams"></div><div id="spots"></div><div id="string"></div><div id="ball"></div>
</div>
<script>
/*VARS*/
const P = V.params, at = FX.num(P.at, 0), hold = FX.num(P.hold, 1.35), end = Math.min(3, at + hold);
const COLS = ['#ff28c8', '#28dcff', '#ffe628', '#3cff5a', '#7846ff', '#ff4632'];
const BX = FX.num(P.ball_x, 540), BY = 150, R = 78;
const tl = gsap.timeline({ paused: true });
// the ball: grey facets in a circle, with a soft highlight
const ball = document.getElementById('ball');
let facets = '';
for (let y = -R; y < R; y += 13) for (let x = -R; x < R; x += 13)
  if ((x + 6) ** 2 + (y + 6) ** 2 < (R - 2) ** 2) { const v = 110 + Math.floor(135 * Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1));
    facets += `<rect x="${x}" y="${y}" width="11" height="11" fill="rgb(${v},${v},${Math.min(255, v + 15)})"/>`; }
ball.innerHTML = `<svg width="${2 * R + 8}" height="${2 * R + 8}" viewBox="${-R - 4} ${-R - 4} ${2 * R + 8} ${2 * R + 8}">
  <defs><clipPath id="c"><circle r="${R - 2}"/></clipPath><radialGradient id="g" cx="35%" cy="30%" r="70%">
  <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient></defs>
  <g clip-path="url(#c)"><g id="fac">${facets}</g><circle r="${R}" fill="url(#g)"/></g></svg>`;
const glints = [[-30, -25, 0], [28, 10, 1.9], [-8, 35, 3.7]].map(([x, y, ph]) => { const s = FX.sparkle(18); ball.appendChild(s);
  s.style.left = (R + 4 + x) + 'px'; s.style.top = (R + 4 + y) + 'px'; return [s, ph]; });
const beams = [...Array(6)].map((_, i) => { const d = document.createElement('div'); d.className = 'beam';
  d.style.left = BX + 'px'; d.style.top = BY + 'px'; document.getElementById('beams').appendChild(d); return d; });
const spots = [...Array(7)].map((_, i) => { const d = document.createElement('div'); d.className = 'spot';
  const r = 68 + 20 * (i % 3); d.style.width = 2 * r + 'px'; d.style.height = 1.6 * r + 'px'; d.style.margin = `${-.8 * r}px 0 0 ${-r}px`;
  document.getElementById('spots').appendChild(d); return d; });
tl.set(['#beams', '#spots', '#ball', '#string'], { opacity: 0 }, 0);
FX.frames(tl, at, end, t => {
  const u = t - at, k = Math.min(1, u / .1) * Math.min(1, (end - t) / .25);   // fade in 0.1 s, out 0.25 s
  const strobe = .85 + .15 * Math.sin(t * 40);
  const drop = Math.min(1, u / .25), eb = 1 + 2.4 * Math.pow(drop - 1, 3) + 1.4 * Math.pow(drop - 1, 2);   // ease-out-back
  const cy = -R + (BY + R) * eb;
  const out = [
    ['#v', { filter: `brightness(${1 - .45 * k})` }],
    ['#beams', { opacity: .9 * k * strobe }], ['#spots', { opacity: .6 * k * strobe }],
    ['#ball', { opacity: k, x: BX - R - 4, y: cy - R - 4, rotation: (t * 172) % 360 }],
    ['#string', { opacity: k, x: BX - 2, height: Math.max(0, cy - R) }],
  ];
  beams.forEach((b, i) => out.push([b, { y: cy - BY, rotation: (1.1 * Math.sin(t * 2.6 + i * 1.05) + (i - 2.5) * .32) * 57.3,
    background: `linear-gradient(${COLS[(i + Math.floor(t * 6)) % 6]}, transparent 92%)` }]));
  spots.forEach((s, i) => out.push([s, { left: 540 + 486 * Math.sin(t * (2.1 + .3 * i) + i * 2.3),
    top: 1920 * .45 + 576 * Math.sin(t * (1.7 + .25 * i) + i * 1.3), background: COLS[(i + Math.floor(t * 4)) % 6] }]));
  glints.forEach(([g, ph]) => { const s = .5 + .5 * Math.sin(t * 14 + ph); out.push([g, { opacity: s > .2 ? s : 0, rotation: -(t * 172) % 360 }]); });
  return out;
});
tl.set('#v', { filter: 'none' }, end + .01);
tl.set(['#beams', '#spots', '#ball', '#string'], { opacity: 0 }, end + .01);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
