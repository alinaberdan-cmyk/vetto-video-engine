<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* PDF p.7 "Notifications over my head": iPhone-like notifications drop from the top: dark frosted glass, radius 34,
   app icon left, app name and "now" on top, bold title and one line below. Four at 0.05, 0.4, 0.75, 1.1 s. Each new
   one lands on top and springs the older ones down; older ones shrink and darken slightly. The stack sits above the
   head, never on the face. Icons drawn here, no real company logos. */
.nt { position: absolute; left: 70px; width: 940px; height: 168px; border-radius: 34px; padding: 22px 26px; box-sizing: border-box; display: flex; gap: 22px;
  background: rgba(30,30,32,.62); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); color: #fff; opacity: 0;
  box-shadow: 0 16px 40px rgba(0,0,0,.3); transform-origin: 50% 0; }
.ic { flex: none; width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; font: 700 40px/1 'TikTok Sans'; color: #fff; }
.bd { flex: 1; min-width: 0; }
.tp { display: flex; justify-content: space-between; font: 500 26px/1.2 -apple-system, 'Helvetica Neue'; color: rgba(255,255,255,.62); text-transform: uppercase; letter-spacing: .02em; }
.ti { font: 700 32px/1.25 -apple-system, 'Helvetica Neue'; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln { font: 400 30px/1.25 -apple-system, 'Helvetica Neue'; color: rgba(255,255,255,.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
</div>
<script>
/*VARS*/
const P = V.params, said = V.words.map(w => w.text).join(' ');
const COLORS = ['#FE48B7', '#421DFC', '#FEA048', '#1DB954'];
const items = [1, 2, 3, 4].map(i => ({ app: P[`n${i}_app`] || 'FeedMe', title: P[`n${i}_title`] || (i === 1 ? (V.word || 'New order') : 'New message'),
  line: P[`n${i}_line`] || said }));
const root = document.getElementById('root');
const els = items.map((it, i) => { const e = document.createElement('div'); e.className = 'nt';
  e.innerHTML = `<div class="ic" style="background:${COLORS[i]}">${it.app.trim()[0] || '•'}</div><div class="bd"><div class="tp"><span>${it.app}</span><span>now</span></div><div class="ti">${it.title}</div><div class="ln">${it.line}</div></div>`;
  root.appendChild(e); return e; });
// the stack's top edge: as high as possible above the head; it may overlap hair, never the face
const f = V.face, bottomLimit = f ? f[1] - 30 : 700;
const top0 = Math.max(90, Math.min(160, bottomLimit - 168 - 3 * 70));
const tl = gsap.timeline({ paused: true });
const times = [.05, .05 + .35, .05 + .35 + .25, .05 + .35 + .25 + .18];   // the gaps shrink (never a uniform stagger)
els.forEach((e, i) => {
  gsap.set(e, { top: top0, y: -260, opacity: 0, zIndex: 10 + i });
  tl.to(e, { y: 0, opacity: 1, duration: .32, ease: 'back.out(1.5)' }, times[i]);
  // older ones get pushed down, shrink and darken a little each time a new one lands
  for (let j = i + 1; j < els.length; j++) {
    const depth = j - i;
    tl.to(e, { y: depth * 70, scale: 1 - depth * .045, filter: `brightness(${1 - depth * .12})`, duration: .32, ease: 'back.out(1.4)' }, times[j]);
  }
});
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
