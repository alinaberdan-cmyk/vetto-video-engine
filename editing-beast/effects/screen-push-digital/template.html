<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* PDF p.5 "Pixel words": almost black, an RGB sub-pixel grid over everything (a camera filming a screen up close).
   Huge white words of the phrase slide right to left, one word in frame at a time; light glow, red and blue copies
   offset 3 px, motion blur. The last word stops in the centre by 1.6 s and flickers slightly to the end.
   Bold font, the longest word no wider than 890 px. */
#root { background: #050506; }
.w { position: absolute; top: 960px; left: 540px; white-space: nowrap; font: 400 300px/1 'Anton'; color: #fff; text-transform: uppercase;
  text-shadow: -3px 0 rgba(255,40,40,.85), 3px 0 rgba(40,90,255,.85), 0 0 40px rgba(255,255,255,.45); will-change: transform, filter; }
#grid { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(255,0,0,.16) 0 2px, rgba(0,255,0,.16) 2px 4px, rgba(0,0,255,.16) 4px 6px),
              repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0 1px, transparent 1px 6px); mix-blend-mode: multiply; }
#glow { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,255,255,.06), transparent 60%); }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920"><div id="glow"></div><div id="grid" style="z-index:9"></div></div>
<script>
/*VARS*/
const phrase = (V.params.phrase || V.words.slice(0, 4).map(w => w.text).join(' ') || V.word || 'FOOD').replace(/[.,!?]/g, '');
const words = phrase.split(/\s+/).filter(Boolean).slice(0, 5);
const root = document.getElementById('root');
const els = words.map(w => { const e = document.createElement('div'); e.className = 'w'; e.textContent = w; root.insertBefore(e, document.getElementById('grid')); return e; });
// longest word no wider than 890 px
els.forEach(e => { const w = e.getBoundingClientRect().width; if (w > 890) e.style.fontSize = (300 * 890 / w) + 'px'; });
const tl = gsap.timeline({ paused: true });
const n = els.length, slot = 1.6 / n;
els.forEach((e, i) => {
  const w = e.getBoundingClientRect().width, h = e.getBoundingClientRect().height;
  gsap.set(e, { x: 1080 - (540 - w / 2) + 40, y: -h / 2, xPercent: -50 });
  const t0 = i * slot, last = i === n - 1;
  tl.fromTo(e, { x: 1300, filter: 'blur(14px)' }, { x: 0, filter: 'blur(0px)', duration: slot * .55, ease: EASE.out }, t0);
  if (!last) tl.to(e, { x: -1300, filter: 'blur(14px)', duration: slot * .45, ease: EASE.inOut }, t0 + slot * .55);
  else for (let k = 0; k < 10; k++) tl.to(e, { opacity: k % 2 ? 1 : .82, duration: .07 }, 1.6 + k * .14);
});
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
