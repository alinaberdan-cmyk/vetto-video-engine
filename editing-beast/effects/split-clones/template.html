<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>/* Preview only (the export uses ffmpeg): three copies of the frame side by side, offset in time (the outer two a little smaller and darker). */
.c { position: absolute; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
.c img, .c video { width: 1080px; height: 1920px; object-fit: cover; }
#a { left: -360px; filter: brightness(.82); } #b { left: 360px; filter: brightness(.82); } #m { left: 0; clip-path: inset(0 360px 0 360px); }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="c" id="a"><video class="clip" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
  <div class="c" id="b"><video class="clip" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
  <div class="c" id="m"><video class="clip" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
</div>
<script>
/*VARS*/
const tl = gsap.timeline({ paused: true });
tl.fromTo(['#a', '#b'], { opacity: 0 }, { opacity: 1, duration: .12, stagger: .12 }, .1);
tl.fromTo('#a', { x: 120 }, { x: 0, duration: .4, ease: EASE.out }, .1).fromTo('#b', { x: -120 }, { x: 0, duration: .4, ease: EASE.out }, .22);
tl.to(['#a', '#b'], { opacity: 0, duration: .2 }, 2.75);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
