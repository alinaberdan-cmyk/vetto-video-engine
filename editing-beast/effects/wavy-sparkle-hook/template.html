<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Meme Chaos hook (the dumb-scale edit, 17 Nov 2026; idea from the start of the Emma Chamberlain sound-effects video
   h2lJsTaBBU0): a rounded bubbly title (Coiny, white, thick dark-green outline, soft shadow), letters pop in one by
   one with an overshoot, then every letter keeps floating on a wave (±16 px, ±6°); ten 4-point sparkles twinkle
   around it. Sits on the chest, under the face. Use "/" in the text to choose the line break. */
#hook { position: absolute; left: 0; right: 0; text-align: center; }
.ln { display: block; white-space: nowrap; font-family: 'Coiny', sans-serif; font-size: 92px; line-height: 1.18; color: #fff;
      -webkit-text-stroke: 18px var(--stroke, #1c5428); paint-order: stroke fill; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.ln span { display: inline-block; opacity: 0; }
#sp { position: absolute; inset: 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
  <div id="hook"></div><div id="sp"></div>
</div>
<script>
/*VARS*/
const P = V.params, f = HK.face(V), hold = FX.num(P.hold, 2.9);
document.getElementById('root').style.setProperty('--stroke', P.color || '#1c5428');
const txt = HK.text(P, V);
const lines = txt.includes('/') ? txt.split('/').map(s => s.trim()).filter(Boolean) : HK.lines(HK.words(txt), txt.length > 16 ? 2 : 1);
const hook = document.getElementById('hook');
hook.innerHTML = lines.map(l => `<div class="ln">${[...l].map(c => `<span>${c === ' ' ? '&nbsp;' : HK.esc(c)}</span>`).join('')}</div>`).join('');
[...hook.children].forEach(d => HK.fit(d, 980, 92));
const hh = hook.getBoundingClientRect().height;
// on the chest: just under the chin, kept on screen
const top = Math.max(120, Math.min(1920 - hh - 420, f[1] + f[3] * 1.25));
hook.style.top = top + 'px';
const letters = [...hook.querySelectorAll('span')];
const sp = document.getElementById('sp');
const SP = [[150, 250, 30, 0, 1.6], [930, 235, 26, 1.7, 1.9], [110, 470, 22, 3.1, 1.4], [965, 455, 32, .8, 1.7], [300, 160, 18, 2.4, 2.2],
            [780, 520, 20, 4.0, 1.5], [540, 120, 16, 5.1, 2.0], [60, 360, 14, 1.2, 2.4], [1020, 340, 16, 3.6, 2.1], [420, 560, 14, .4, 1.8]]
  .map(([x, y, s, ph, spd]) => { const d = FX.sparkle(s); d.style.left = x + 'px'; d.style.top = (top - 250 + y * hh / 430) + 'px'; sp.appendChild(d); return [d, ph, spd]; });
const tl = gsap.timeline({ paused: true });
const end = Math.min(3, hold);
FX.frames(tl, 0, end, t => {
  const out = [], fade = t > end - .3 ? Math.max(0, (end - t) / .3) : 1;
  letters.forEach((el, i) => {
    const u = Math.min(1, Math.max(0, (t - .04 * i) / .28));
    const pop = u >= 1 ? 1 : u <= 0 ? .01 : 1 + 2.9 * Math.pow(u - 1, 3) + 1.9 * Math.pow(u - 1, 2);
    const w = 2 * Math.PI * 1.1 * t + i * .55;
    out.push([el, { opacity: (u > 0 ? 1 : 0) * fade, y: 16 * Math.sin(w), rotation: 6 * Math.sin(w + .8), scale: Math.max(.01, pop) }]);
  });
  SP.forEach(([d, ph, spd]) => { const s = .5 + .5 * Math.sin(t * spd * 3 + ph); out.push([d, { opacity: (s > .15 ? s : 0) * Math.min(1, t / .3) * fade, scale: .6 + .5 * s }]); });
  return out;
});
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
