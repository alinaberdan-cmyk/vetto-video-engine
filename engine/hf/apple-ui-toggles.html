<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* PDF p.6 "iOS toggles": a white card like iPhone Settings, centred in the lower half; three rows with thin dividers;
   a real iOS switch on the right of each (track 102x62, white knob with shadow). The card appears in 0.25 s; the
   switches turn on at 0.3, 0.8 and 1.3 s, the knob overshoots slightly, the track turns green #34C759. Video under
   the card darkened slightly. */
#card { position: absolute; left: 90px; width: 900px; top: 1130px; background: #fff; border-radius: 36px; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; height: 132px; padding: 0 40px; font: 500 44px/1.1 -apple-system, 'Helvetica Neue', sans-serif; color: #111; }
.row + .row { border-top: 2px solid #E5E5EA; }
.sw { position: relative; flex: none; width: 102px; height: 62px; border-radius: 31px; background: #E9E9EA; }
.kn { position: absolute; left: 3px; top: 3px; width: 56px; height: 56px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.12); }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
  <div class="dim" id="dim"></div>
  <div id="card"></div>
</div>
<script>
/*VARS*/
const P = V.params, said = V.words.map(w => w.text);
const lines = [P.line1, P.line2, P.line3].map((x, i) => x || said.slice(i * 2, i * 2 + 2).join(' ') || `Step ${i + 1}`);
const card = document.getElementById('card');
card.innerHTML = lines.map((l, i) => `<div class="row"><span>${l}</span><div class="sw" id="s${i}"><div class="kn" id="k${i}"></div></div></div>`).join('');
// keep the card off the face: under the chin if the face is low
const f = V.face; const cardTop = Math.max(1130, f ? f[1] + f[3] + 80 : 1130); card.style.top = Math.min(cardTop, 1920 - 470) + 'px';
const tl = gsap.timeline({ paused: true });
tl.to('#dim', { opacity: .3, duration: .25 }, 0);
tl.fromTo('#card', { opacity: 0, y: 40, scale: .97 }, { opacity: 1, y: 0, scale: 1, duration: .25, ease: EASE.out }, 0);
[.3, .8, 1.3].forEach((t, i) => {
  tl.to(`#k${i}`, { x: 40, duration: .28, ease: 'back.out(2.2)' }, t);
  tl.to(`#s${i}`, { backgroundColor: '#34C759', duration: .2, ease: 'none' }, t);
});
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
