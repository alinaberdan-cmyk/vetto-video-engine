<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Meme Chaos (the clapping parts of the dumb-scale edit, 17 Nov 2026): on every clap the picture jumps in to 1.07
   and settles back over 0.2 s (6 frames), measured from Alina's edit. Clap times come from the piece's own sound
   (sharp hits); `times` overrides them. */
#v { position: absolute; inset: 0; transform-origin: 50% 50%; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div id="v"><video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
</div>
<script>
/*VARS*/
const P = V.params, k = FX.num(P.strength, 1.07), maxN = FX.num(P.max, 14);
let times = String(P.times || '').split(/[ ,;]+/).map(parseFloat).filter(x => !isNaN(x));
if (!times.length) times = (V.onsets || []).slice();
times = times.filter(t => t >= 0 && t < 2.9).slice(0, maxN);
const tl = gsap.timeline({ paused: true });
times.forEach((t, i) => {
  const next = times[i + 1] ?? 3, dur = Math.min(.2, Math.max(.06, next - t - .01));
  tl.set('#v', { scale: k }, t).to('#v', { scale: 1 + (k - 1) * .1, duration: dur, ease: EASE.out }, t);
});
tl.set('#v', { scale: 1 }, Math.min(2.99, (times[times.length - 1] ?? 0) + .25));
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
