<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Meme Chaos (the "one, two, three" pose at the end of the dumb-scale edit, 17 Nov 2026): every face in the frame
   swells into a big-nose fisheye face for ~1.9 s, easing in and out over 4 frames. A displacement map is drawn per
   0.5 s from the face boxes (bin/vision) and applied to the video with an SVG filter. */
#v { position: absolute; inset: 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <svg width="0" height="0" style="position:absolute"><filter id="warp" x="0" y="0" width="1080" height="1920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feImage id="map" x="0" y="0" width="1080" height="1920" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap id="dm" in="SourceGraphic" in2="m" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter></svg>
  <div id="v"><video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video></div>
</div>
<script>
/*VARS*/
const P = V.params, at = FX.num(P.at, 0), hold = FX.num(P.hold, 1.85), amount = FX.num(P.amount, 1);
const S = 420;                                     // displacement scale in px (map value 0..1 → -S/2..S/2)
// one map per vision sample (0.5 s): sample nearer the centre of each face (magnify), plus a smaller, stronger
// bulge on the nose, so faces swell like the CapCut "big face" warp in Alina's edit
function mapFor(faces) {
  const w = 270, h = 480, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data;
  const bul = faces.flatMap(f => [[f[0] + f[2] / 2, f[1] + f[3] * .45, f[2] * 1.15, .5], [f[0] + f[2] / 2, f[1] + f[3] * .56, f[2] * .6, .38]]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const X = x * 4, Y = y * 4; let ox = 0, oy = 0;
    for (const [cx, cy, r, k] of bul) { const dx = X - cx, dy = Y - cy, q = (dx * dx + dy * dy) / (r * r);
      if (q < 1) { const f = (1 - q) * (1 - q) * k * amount; ox -= dx * f; oy -= dy * f; } }
    const i = 4 * (y * w + x);
    d[i] = Math.max(0, Math.min(255, 128 + ox / S * 255)); d[i + 1] = Math.max(0, Math.min(255, 128 + oy / S * 255)); d[i + 2] = 0; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0); return c.toDataURL();
}
const track = (V.track || []).filter(t => (t.faces && t.faces.length) || t.face);
const maps = track.length ? track.map(t => [t.t, mapFor(t.faces && t.faces.length ? t.faces : [t.face])]) : [[0, mapFor([HK.face(V)])]];
const tl = gsap.timeline({ paused: true });
const map = document.getElementById('map'), dm = document.getElementById('dm');
maps.forEach(([t, url], i) => tl.set(map, { attr: { href: url } }, i === 0 ? 0 : Math.max(0, t - .25)));
tl.set('#v', { filter: 'url(#warp)' }, 0);
tl.fromTo(dm, { attr: { scale: 0 } }, { attr: { scale: S }, duration: .13, ease: EASE.out }, at);
tl.to(dm, { attr: { scale: 0 }, duration: .13, ease: EASE.inOut }, Math.min(2.85, at + hold));
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
