<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Cinema Lexicon swipe chips (CL01 v6 "you just swipe left / right", 21.72 and 25.44 s): a round chip, ✕ in red or ♥ in the
   brand colour, flies off the frame in the swipe direction, speeding up. */
.clip.take { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
#chip { position: absolute; left: 450px; top: 1230px; width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 14px 30px rgba(0,0,0,.25); opacity: 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip take" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
  <div id="chip"></div>
</div>
<script>
/*VARS*/
const P = V.params || {}, B = V.brand || {}, C = Object.assign({ accent: '#E028B0' }, B.colors || {});
const right = /right|like|yes|love/i.test(String(P.dir || V.word || ''));
const chip = document.getElementById('chip');
chip.style.background = right ? C.accent : '#E5383B';
chip.innerHTML = right
  ? '<svg width="96" height="96" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2.2 0 3.6 1.3 4.4 2.5h2.4C14 6.3 15.4 5 17.6 5 21.1 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z" fill="#fff"/></svg>'
  : '<svg width="90" height="90" viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>';
const at = Math.max(0, +P.at || .02);
const tl = gsap.timeline({ paused: true });
tl.set('#chip', { opacity: 1 }, at);
tl.fromTo('#chip', { x: 0, scale: .6, rotation: 0 }, { x: right ? 720 : -720, scale: 1, rotation: right ? 30 : -30, duration: right ? .36 : .42, ease: 'power2.in' }, at);
tl.set('#chip', { opacity: 0 }, at + .45);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
