<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Neon Dimension §6 "neon pill": an outlined rounded pill (5 px stroke #39FF6A, radius 22, outer + inner glow), the
   text in Anton italic-skewed white caps, 84–92 px, at chest height. For the CTA ("DROP A COMMENT") or one stressed word. */
#pill { position: absolute; left: 50%; padding: 22px 46px 18px; border: 5px solid var(--n); border-radius: 22px; transform: translateX(-50%);
        box-shadow: 0 0 18px var(--n), 0 0 46px var(--n), inset 0 0 18px var(--n); white-space: nowrap; background: rgba(0,0,0,.25); }
#pill span { display: inline-block; font: 400 88px/1 'Anton'; color: #fff; text-transform: uppercase; transform: skewX(-7deg); text-shadow: 0 0 14px rgba(255,255,255,.6); }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
  <div id="pill"><span></span></div>
</div>
<script>
/*VARS*/
const P = V.params, f = HK.face(V), neon = P.color || '#39FF6A';
const pill = document.getElementById('pill'); pill.style.setProperty('--n', neon);
pill.querySelector('span').textContent = HK.text(P, V);
HK.fit(pill.querySelector('span'), 880, 88);
pill.style.top = Math.min(1600, Math.max(1000, f[1] + f[3] * 1.5)) + 'px';
const tl = gsap.timeline({ paused: true });
tl.fromTo('#pill', { opacity: 0, scale: 1.3, xPercent: 0 }, { opacity: 1, scale: 1, duration: .16, ease: EASE.out }, .05);
tl.to('#pill', { boxShadow: `0 0 26px ${neon}, 0 0 70px ${neon}, inset 0 0 24px ${neon}`, duration: .5, yoyo: true, repeat: 3, ease: 'sine.inOut' }, .3);
tl.to('#pill', { opacity: 0, duration: .12 }, 2.86);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
