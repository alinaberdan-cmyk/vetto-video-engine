<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>/* Preview only (the export overlays the photo with ffmpeg): the photo of the thing pops in beside me, tilted, with a white border. */
#ph { position: absolute; right: 70px; top: 330px; width: 440px; height: 550px; border: 14px solid #fff; border-radius: 20px; background: #ddd center/cover; box-shadow: 0 24px 50px rgba(0,0,0,.35); transform: rotate(-3deg); display: flex; align-items: center; justify-content: center; font: 700 52px/1.1 'TikTok Sans'; color: #555; text-align: center; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video><div id="ph"></div>
</div>
<script>
/*VARS*/
const ph = document.getElementById('ph');
if (V.images && V.images.length) ph.style.backgroundImage = `url(${V.images[0]})`; else ph.textContent = 'your photo of “' + (V.word || 'the thing') + '”';
const tl = gsap.timeline({ paused: true });
tl.fromTo('#ph', { scale: .7, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -3, duration: .4, ease: 'back.out(2)' }, .05);
tl.to('#ph', { opacity: 0, scale: .9, duration: .2, ease: EASE.inOut }, 1.65);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
