<!doctype html><html><head><meta charset="utf-8"><!--BASE-->
<style>
/* Text hook 6 (ref "walking / between | in / text"): the text splits into two columns, one on each side of me, at
   head height, and I stand or walk between them (person cutout over the text). */
.col { position: absolute; }
#l { text-align: right; } #r { text-align: left; }
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video class="clip full" data-start="0" data-duration="3" src="assets/piece.mp4" muted></video>
  <div id="l" class="hk col"></div><div id="r" class="hk col"></div>
  <video id="cut" class="clip full" data-start="0" data-duration="3" src="assets/cut.webm" muted></video>
</div>
<script>
/*VARS*/
const P = V.params, f = HK.face(V);
const ws = HK.words(HK.text(P, V)), half = Math.ceil(ws.length / 2);
const L = HK.lines(ws.slice(0, half), 2), Rr = HK.lines(ws.slice(half), 2);
const l = document.getElementById('l'), r = document.getElementById('r');
l.innerHTML = L.map(x => `<div>${HK.esc(x)}</div>`).join(''); r.innerHTML = Rr.map(x => `<div>${HK.esc(x)}</div>`).join('');
const cx = f[0] + f[2] / 2, gap = f[2] * .62;   // beside the head: the body can be wide, the head is not
const lw = Math.max(200, cx - gap - 30), rw = Math.max(200, 1080 - (cx + gap) - 30);
const size = Math.min(+(HK.fit(l, lw, 84).style.fontSize.replace('px', '')), +(HK.fit(r, rw, 84).style.fontSize.replace('px', '')));
l.style.fontSize = r.style.fontSize = size + 'px';
const bh = l.getBoundingClientRect().height, y = Math.max(120, Math.min(1500, f[1] + f[3] * .5 - bh / 2));
l.style.right = (1080 - (cx - gap)) + 'px'; l.style.top = y + 'px'; r.style.left = (cx + gap) + 'px'; r.style.top = y + 'px';
const tl = gsap.timeline({ paused: true });
tl.fromTo('#l', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .3, ease: EASE.out }, .05);
tl.fromTo('#r', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: .3, ease: EASE.out }, .16);
tl.to('.col', { opacity: 0, duration: .22, ease: EASE.inOut }, 2.74);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script></body></html>
